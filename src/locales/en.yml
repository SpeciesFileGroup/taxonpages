---
# Framework-wide message catalog.
#
# `common.*`    — strings shared across modules and panels
# `component.*` — strings belonging to a shared component in src/components
#
# Anything specific to a module or panel belongs in that package's own
# catalog (e.g. src/modules/otus/locales/en.yml), namespaced by its id.
#
# Keep `common` for short, context-free strings whose translation does not
# depend on where they appear. When in doubt, duplicate into the module's own
# catalog instead — one shared key that needs two different translations is
# worse than two keys.
#
# A site can override any key here by redefining it in ~/locales/en.yml.
common:
  no_records: No records found.
  json_data: JSON Data
  total: Total
  source: Source
  close: Close
  expand: Expand
  opens_new_window: (opens in new window)

component:
  spinner:
    loading: Loading...
    legend: Loading, please wait.

  pagination:
    label: Pagination
    first: Go to first page
    previous: Go to previous page
    next: Go to next page
    last: Go to last page

  autocomplete:
    placeholder: Search...

  clipboard:
    copy: Copy to clipboard
    copied: Copied to clipboard

  image_viewer:
